<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>恢复备份成功</title>
  <style>
    body{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial;margin:24px}
    .card{border:1px solid #e6e6e6;padding:18px;border-radius:6px;max-width:900px}
    .meta{color:#666;font-size:0.95em;margin-top:8px}
    a{color:#1a73e8}
  </style>
</head>
<body>
  <h1>已从备份恢复数据库</h1>
  <div class="card">
    <p>{{ message }}</p>
    <p class="meta">备份文件: <strong>{{ backup_file }}</strong></p>
    <p class="meta">耗时: {{ solve_time }} 秒</p>
  </div>
</body>
</html>
