<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>归档备份列表</title>
  <style>
    body{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial;margin:24px}
    table{border-collapse:collapse;width:100%}
    th,td{padding:8px;border:1px solid #ddd;text-align:left}
    th{background:#f6f6f6}
    .small{color:#666;font-size:0.9em}
  </style>
</head>
<body>
  <h1>归档备份</h1>
  <p class="small">归档目录: archives</p>
  {% if archive_files and archive_files|length > 0 %}
  <table>
    <thead>
      <tr>
        <th>文件名</th>
        <th>大小 (字节)</th>
        <th>路径</th>
      </tr>
    </thead>
    <tbody>
      {% for f in archive_files %}
      <tr>
        <td>{{ f.file_name }}</td>
        <td>{{ f.file_size }}</td>
        <td class="small">{{ f.file_path }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>未发现归档文件。</p>
  {% endif %}
  <p style="margin-top:18px;"><a href="/">返回首页</a></p>
</body>
</html>
